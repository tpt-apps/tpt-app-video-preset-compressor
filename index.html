<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TPT Video Compressor — TPT AppFront</title>
    <!-- data-wasm-opt="0" disables trunk's wasm-opt pass: the modern Rust
         wasm target emits bulk-memory opcodes that the cached Binaryen
         rejects, and the release profile (opt-level = "z", lto, strip)
         already keeps the payload small. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <!-- The vendored ffmpeg.wasm runtime must sit flat, next to the glue,
         in every host (src/ffmpeg.rs resolves the files relative to the
         glue module's own URL). -->
    <link data-trunk rel="copy-file" href="assets/ffmpeg.js" />
    <link data-trunk rel="copy-file" href="assets/814.ffmpeg.js" />
    <link data-trunk rel="copy-file" href="assets/ffmpeg-core.js" />
    <link data-trunk rel="copy-file" href="assets/ffmpeg-core.wasm" />
  </head>
  <body>
    <!-- Marker div: `start()` mounts here for standalone dev only; when the
         build is embedded in tptsolutions.co.nz/tools the hub runner calls
         `mount(container)` itself and this file is never served. -->
    <div id="tpt-appfront-root"></div>
  </body>
</html>
